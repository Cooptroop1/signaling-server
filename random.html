<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Anonomoose Random Chat</title>
 <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://raw.githubusercontent.com https://cdnjs.cloudflare.com; media-src 'self' blob: data:; connect-src 'self' wss://signaling-server-zc6m.onrender.com wss://signaling-server-1.onrender.com wss://signaling-server.onrender.com https://api.x.ai; object-src 'none';">
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" integrity="sha512-wnea99uKIC3TJF7v4eKk4Y+lMz2Mklv18+r4na2Gn1abDRPPOeef95xTzdwGD9e6zXJBteMIhZ1+68QC5byJZw==" crossorigin="anonymous">
 <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/Cooptroop1/anonmess/main/logo.JPG"/>
 <style>
 body {
 min-height: 100vh;
 display: flex;
 justify-content: center;
 align-items: center;
 background-color: #000;
 color: #fff;
 }
 .container {
 max-width: 500px;
 width: 100%;
 padding: 20px;
 background-color: #fff;
 color: #000;
 border-radius: 10px;
 box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
 }
 #randomCodes {
 margin-top: 1rem;
 text-align: left;
 }
 .code-item {
 padding: 0.5rem;
 margin: 0.5rem 0;
 background-color: #10b981; /* Green background */
 border-radius: 0.5rem;
 cursor: pointer;
 color: white; /* White text for contrast */
 text-align: center; /* Centered text */
 font-weight: bold; /* Bolder text for better look */
 }
 .code-item:hover {
 background-color: #059669; /* Darker green on hover */
 }
 #status {
 margin-bottom: 1rem;
 text-align: center;
 color: #666;
 }
 .hidden {
 display: none !important;
 }
 </style>
</head>
<body>
 <div class="container">
 <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">Random Chat Board</h1>
 <div id="status" class="text-center mb-4 text-gray-600" role="status" aria-live="polite">Loading random chat codes...</div>
 <div id="randomCodes" class="hidden"></div>
 <div class="text-center mt-4">
 <a href="index.html" class="text-blue-500 hover:underline">Back to Chat</a>
 </div>
 </div>
 <script>
 const hosts = [
   'wss://signaling-server-zc6m.onrender.com'
 ];
 let hostIndex = 0;
 let socket;
 const statusElement = document.getElementById('status');
 const randomCodesElement = document.getElementById('randomCodes');
 let clientId = window.__CLIENT_ID__ || (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2, 11));
 let token = '';
 try { localStorage.setItem('anonClientId', clientId); } catch (e) {}

 function bindSocket(url) {
   socket = new WebSocket(url);
   socket.onopen = () => {
     console.log('Random page WebSocket opened', url);
     socket.send(JSON.stringify({ type: 'connect', clientId }));
   };
   socket.onmessage = (event) => {
     try {
       const message = JSON.parse(event.data);
       if (message.type === 'connected') {
         token = message.accessToken;
         socket.send(JSON.stringify({ type: 'get-random-codes', clientId, token }));
       } else if (message.type === 'random-codes') {
         randomCodesElement.innerHTML = '';
         if (!message.codes || message.codes.length === 0) {
           statusElement.textContent = 'No random chats waiting. On the main app: Start Chat, then Send Code, and stay in the room.';
           randomCodesElement.classList.add('hidden');
         } else {
           statusElement.textContent = 'Tap a code to join. The host must still be in that chat.';
           randomCodesElement.classList.remove('hidden');
           message.codes.forEach(code => {
             const codeDiv = document.createElement('div');
             codeDiv.className = 'code-item';
             codeDiv.textContent = code;
             codeDiv.onclick = () => {
               let join = 'https://www.anonomoose.com/?code=' + encodeURIComponent(code);
               try {
                 const n = localStorage.getItem('username') || sessionStorage.getItem('username') || '';
                 if (n) join += '&name=' + encodeURIComponent(n);
               } catch (e) {}
               window.location.href = join;
             };
             randomCodesElement.appendChild(codeDiv);
           });
         }
       } else if (message.type === 'error') {
         statusElement.textContent = message.message;
       }
     } catch (error) {
       console.error('Error parsing message:', error);
       statusElement.textContent = 'Error loading random chats.';
     }
   };
   socket.onerror = () => {
     statusElement.textContent = 'Connection error. Please refresh.';
   };
   socket.onclose = () => {
     if (hostIndex < hosts.length - 1) {
       hostIndex += 1;
       bindSocket(hosts[hostIndex]);
       return;
     }
     statusElement.textContent = 'Disconnected. Please refresh.';
   };
 }
 bindSocket(hosts[0]);
 </script>
</body>
</html>
