<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>East Anglia Forecast</title>
  <style>
    body { margin: 0; font-family: Georgia, serif; background: #e8eef4; color: #1e293b; }
    header { background: #334155; color: #fff; padding: 0.8rem 1rem; font-size: 1.1rem; }
    main { max-width: 28rem; margin: 1.2rem auto; background: #fff; padding: 1.2rem; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    h1 { font-size: 1.3rem; margin: 0 0 0.4rem; }
    .temp { font-size: 3rem; font-weight: 700; }
    .row { display: flex; justify-content: space-between; padding: 0.45rem 0; border-bottom: 1px solid #e2e8f0; font-size: 0.95rem; }
    footer { text-align: center; color: #64748b; font-size: 0.75rem; margin: 1.5rem; }
  </style>
</head>
<body>
  <header>Regional forecast</header>
  <main>
    <h1>East of England</h1>
    <p class="temp">14°</p>
    <p>Cloudy with light showers later. Light south-westerly breeze.</p>
    <div class="row"><span>Tonight</span><span>9° · rain</span></div>
    <div class="row"><span>Tomorrow</span><span>16° · bright spells</span></div>
    <div class="row"><span>Tuesday</span><span>15° · cloud</span></div>
    <div class="row"><span>Wednesday</span><span>17° · sun</span></div>
  </main>
  <footer>Updated locally · not a live feed</footer>
</body>
</html>
